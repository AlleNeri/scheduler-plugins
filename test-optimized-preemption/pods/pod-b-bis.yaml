apiVersion: v1
kind: Pod
metadata:
  name: pod-b-bis
spec:
  containers:
  - name: stress-box
    image: alpine:latest
    resources:
      requests:
        cpu: "1000m"
        memory: "2120Mi"
      limits:
        cpu: "1000m"
        memory: "2120Mi"
    command: ["sh", "-c", "apk add --no-cache stress-ng && grep MemTotal /proc/meminfo && awk '/MemTotal/{print int($2*0.99)}' /proc/meminfo && stress-ng --vm 1 --vm-bytes $(awk '/MemTotal/{print int($2*0.99)}' /proc/meminfo)k --timeout 480s"]
